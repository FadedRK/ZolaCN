name: Build ZolaCN

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-rootless:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Show package
        run: ls -lh packages/

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: ZolaCN-rootless
          path: packages/*.deb

  build-rootful:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build rootful package
        run: |
          make clean package FINALPACKAGE=1

      - name: Show package
        run: ls -lh packages/

      - name: Upload rootful package
        uses: actions/upload-artifact@v4
        with:
          name: ZolaCN-rootful
          path: packages/*.deb
