name: Repository Cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_WORKFLOW_ID=353799372
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/workflows/$OLD_WORKFLOW_ID/runs?per_page=100"             --jq '.workflow_runs[].id' | while read -r RUN_ID; do
              if [ -n "$RUN_ID" ]; then
                echo "Deleting workflow run $RUN_ID"
                gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" || true
              fi
            done

      - name: Remove all old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '.artifacts[].id' | while read -r ARTIFACT_ID; do
              if [ -n "$ARTIFACT_ID" ]; then
                echo "Deleting artifact $ARTIFACT_ID"
                gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" || true
              fi
            done
