name: Build ZolaCN Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'dylib/**'
      - 'Translations.plist'
      - 'VERSION'
      - '.github/workflows/build-dylib.yml'

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Embed translations into dylib
        run: python3 dylib/build_embed.py

      - name: Build dylib only
        run: |
          make -C dylib clean
          make -C dylib
          mkdir -p dist
          DYLIB=$(find dylib/.theos -type f -name 'ZolaCN.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" dist/ZolaCN.dylib
          file dist/ZolaCN.dylib
          ls -lh dist/ZolaCN.dylib

      - name: Verify dylib
        run: |
          test -f dist/ZolaCN.dylib
          file dist/ZolaCN.dylib
          otool -hv dist/ZolaCN.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZolaCN-dylib
          path: dist/ZolaCN.dylib
          retention-days: 30

  release-v1:
    needs: build-dylib
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release ZolaCN v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: ZolaCN-dylib
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/ZolaCN.dylib \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZolaCN v1.0.0" \
            --notes-file CHANGELOG.md
