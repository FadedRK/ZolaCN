name: Build ZolaCN Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'dylib/**'
      - 'Translations.plist'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build-dylib.yml'

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Embed translations into dylib
        run: python3 dylib/build_embed.py

      - name: Build dylib only
        run: |
          make -C dylib clean
          make -C dylib
          mkdir -p dist
          DYLIB=$(find dylib/.theos -type f -name 'ZolaCN.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" "dist/ZolaCN.dylib"
          file dist/ZolaCN.dylib
          ls -lh dist/ZolaCN.dylib

      - name: Verify dylib
        run: |
          test -f dist/ZolaCN.dylib
          file dist/ZolaCN.dylib
          otool -hv dist/ZolaCN.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZolaCN-dylib
          path: dist/ZolaCN.dylib
          retention-days: 30

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" dist/ZolaCN.dylib \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZolaCN ${TAG}" \
            --generate-notes
