name: Build ZolaCN Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'dylib/**'
      - 'Translations.plist'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

concurrency:
  group: zolacn-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Embed translations
        run: python3 dylib/build_embed.py

      - name: Build arm64e dylib
        shell: bash
        run: |
          set -euo pipefail
          make -C dylib clean
          make -C dylib
          mkdir -p dist

          DYLIB="$(find dylib/.theos -type f -name 'ZolaCN.dylib' | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" dist/ZolaCN.dylib

          file dist/ZolaCN.dylib
          lipo -verify_arch arm64e dist/ZolaCN.dylib
          ARCHS="$(lipo -archs dist/ZolaCN.dylib)"
          test "$ARCHS" = "arm64e"
          echo "Verified architecture: $ARCHS"
          ls -lh dist/ZolaCN.dylib

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          NOTES="$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            index($0, "## [" ver "]") == 1 { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$NOTES" ]; then
            NOTES="ZolaCN $TAG"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ZolaCN.dylib \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZolaCN $TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$TAG" dist/ZolaCN.dylib \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZolaCN $TAG" \
              --notes "$NOTES"
          fi
