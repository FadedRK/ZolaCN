name: Build ZolaCN Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'dylib/**'
      - 'Translations.plist'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Cleanup previous builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning previous workflow runs..."
          gh run list --workflow "build-dylib.yml" --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId --jq '.[].databaseId' | while read -r RUN_ID; do
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$GITHUB_RUN_ID" ]; then
              gh run delete "$RUN_ID" --repo "$GITHUB_REPOSITORY" --confirm || true
            fi
          done

          echo "Cleaning previous Actions artifacts..."
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r ARTIFACT_ID; do
            if [ -n "$ARTIFACT_ID" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" || true
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Embed translations into dylib
        run: python3 dylib/build_embed.py

      - name: Build dylib only
        run: |
          make -C dylib clean
          make -C dylib
          mkdir -p dist
          DYLIB=$(find dylib/.theos -type f -name 'ZolaCN.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" "dist/ZolaCN.dylib"
          file dist/ZolaCN.dylib
          ls -lh dist/ZolaCN.dylib

      - name: Build BubbleTrace dylib
        run: |
          make -C dylib/trace clean
          make -C dylib/trace
          mkdir -p dist
          TRACE=$(find dylib/trace/.theos -type f -name 'BubbleTrace.dylib' | head -n 1)
          test -n "$TRACE"
          cp "$TRACE" "dist/BubbleTrace.dylib"
          file dist/BubbleTrace.dylib
          ls -lh dist/BubbleTrace.dylib

      - name: Verify dylib
        run: |
          test -f dist/ZolaCN.dylib
          test -f dist/BubbleTrace.dylib
          file dist/ZolaCN.dylib
          file dist/BubbleTrace.dylib
          otool -hv dist/ZolaCN.dylib
          otool -hv dist/BubbleTrace.dylib

      - name: Upload BubbleTrace artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleTrace-dylib
          path: dist/BubbleTrace.dylib
          retention-days: 30

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZolaCN-dylib
          path: dist/ZolaCN.dylib
          retention-days: 30

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if [ "$VERSION" = "1.0.0" ]; then
            for OLD_TAG in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
              if [ "$OLD_TAG" != "$TAG" ]; then
                echo "Deleting old release: $OLD_TAG"
                gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              fi
            done
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ZolaCN.dylib --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          else
            gh release create "$TAG" dist/ZolaCN.dylib \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZolaCN ${TAG}" \
              --generate-notes
          fi
